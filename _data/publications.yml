# Papers on the publications page, grouped into sections. Sections and papers
# appear in the order listed here.
#
# Each paper:
#   title:   the paper title (keep it in quotes)
#   authors: the author list; "S. Chandak" is bolded automatically
#   venue:   free text, shown in italics (e.g. "Submitted to NeurIPS, 2026")
#   links:   optional, shown as [label] in the order listed. Use a full URL, or a
#            path to a file on this site such as Slides/talk.pdf
#
# To split a section into sub-headings, put a line like
#   - subheading: Two-Time-Scale Stochastic Approximation
# in its papers list; the papers after it (up to the next subheading) go under it.
#
# Each section has a name, an id (the #anchor used by the table of contents) and
# optionally a shorter toc label.

